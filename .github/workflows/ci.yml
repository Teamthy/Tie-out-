name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install -e ".[dev]"
      - name: lockfile is current (the deploy installs with uv --locked)
        run: |
          pip install uv
          uv lock --check --python 3.11
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest
      - name: selftest
        run: python -m tieout selftest
      - name: verify committed runs
        run: |
          python -m tieout verify runs/demo
          python -m tieout verify runs/demo-f2
          python -m tieout verify runs/demo-stability/a
          python -m tieout verify runs/demo-stability/b
      - name: stability gate (zero verdict flips)
        run: |
          out=$(python -m tieout diff runs/demo-stability/a runs/demo-stability/b)
          echo "$out"
          echo "$out" | grep -q "stability 1.000"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: build
        run: npm run build
      - name: export contract (pages, articles, author link)
        run: python3 ../scripts/check_export.py out
